# CrossBioSAE Pilot Configuration
# Goal: 1000 genes, small SAE, verify feasibility before scaling

# ============================================================
# Data
# ============================================================
data:
  split: "pilot"
  n_genes: 1000
  organism: "Homo sapiens"
  max_protein_length: 1000
  max_cds_length: 3000
  data_dir: "data/pilot"

# ============================================================
# Protein model (ESM-2 650M for pilot)
# ============================================================
protein_model:
  name: "esm2_t33_650M_UR50D"
  layer: 16  # Middle of 33 layers
  hidden_dim: 1280
  batch_size: 16
  max_length: 1024

# ============================================================
# DNA model (Evo-2 for pilot; may fallback to NT if too large)
# ============================================================
dna_model:
  name: "evo2_7b"
  layer: 16  # Middle of ~32 layers
  hidden_dim: 4096
  batch_size: 4  # Smaller batch for 7B model
  max_length: 3072  # CDS can be longer than protein

# ============================================================
# CrossBioSAE architecture
# ============================================================
model:
  dim_dna: 4096            # Evo-2 hidden dim
  dim_protein: 1280        # ESM-2 650M hidden dim
  dim_shared: 2048         # Shared adapter space
  expansion_factor: 8      # 8x for pilot (16k features)
  sparsity_type: "topk"
  topk_k: 64
  normalize_inputs: true
  tied_decoder: false
  bias: true
  # Cross-modal
  crossmodal_type: "cosine"

# ============================================================
# Training
# ============================================================
training:
  learning_rate: 1.0e-4
  weight_decay: 0.0
  lr_schedule: "cosine"
  warmup_steps: 500
  max_epochs: 50
  batch_size: 256
  grad_clip: 1.0
  # Loss weights
  recon_weight: 1.0
  sparsity_weight: 1.0
  crossmodal_weight: 0.1   # Start small, ramp up
  crossmodal_warmup_steps: 1000
  # Logging
  log_interval: 50
  eval_interval: 200
  save_interval: 1000
  normalize_decoder_interval: 100
  # Infra
  num_workers: 4
  seed: 42

# ============================================================
# Experiment tracking
# ============================================================
wandb:
  enabled: true
  project: "crossbiosae"
  run_name: "pilot_esm2_evo2_1k"

# ============================================================
# Paths
# ============================================================
paths:
  output_dir: "results/pilot"
  checkpoint_dir: "checkpoints/pilot"
  protein_activations: "data/pilot/protein_activations.h5"
  dna_activations: "data/pilot/dna_activations.h5"
