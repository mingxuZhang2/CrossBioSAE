# CrossBioSAE Full-Scale Configuration
# Run this ONLY after pilot succeeds

# ============================================================
# Data
# ============================================================
data:
  split: "full"
  n_genes: null  # All human protein-coding genes (~20k)
  organism: "Homo sapiens"
  max_protein_length: 2000
  max_cds_length: 6000
  data_dir: "data/full"

# ============================================================
# Protein model (ESM-C 600M for full run)
# ============================================================
protein_model:
  name: "esmc_600m"
  layer: 24  # Middle of 48 layers
  hidden_dim: 2560
  batch_size: 8
  max_length: 2048

# ============================================================
# DNA model (Evo-2 7B)
# ============================================================
dna_model:
  name: "evo2_7b"
  layer: 16
  hidden_dim: 4096
  batch_size: 2
  max_length: 6144

# ============================================================
# CrossBioSAE architecture
# ============================================================
model:
  dim_dna: 4096
  dim_protein: 2560         # ESM-C 600M hidden dim
  dim_shared: 2048
  expansion_factor: 32      # 32x for full (65k features)
  sparsity_type: "topk"
  topk_k: 64
  normalize_inputs: true
  tied_decoder: false
  bias: true
  crossmodal_type: "cosine"

# ============================================================
# Training
# ============================================================
training:
  learning_rate: 1.0e-4
  weight_decay: 0.0
  lr_schedule: "cosine"
  warmup_steps: 2000
  max_epochs: 20
  batch_size: 512
  grad_clip: 1.0
  recon_weight: 1.0
  sparsity_weight: 1.0
  crossmodal_weight: 0.1
  crossmodal_warmup_steps: 5000
  log_interval: 100
  eval_interval: 2000
  save_interval: 10000
  normalize_decoder_interval: 100
  num_workers: 8
  seed: 42

# ============================================================
# Experiment tracking
# ============================================================
wandb:
  enabled: true
  project: "crossbiosae"
  run_name: "full_esmc_evo2_20k"

# ============================================================
# Paths
# ============================================================
paths:
  output_dir: "results/full"
  checkpoint_dir: "checkpoints/full"
  protein_activations: "data/full/protein_activations.h5"
  dna_activations: "data/full/dna_activations.h5"
